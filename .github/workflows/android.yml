
name: Build AI Camera Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract Android project
        run: |
          unzip unzip -q AI_Camera_Overlay_UI_Prototype.zip -d extracted

      - name: Fix Java and Kotlin JVM target
        working-directory: extracted/AI_Camera_Overlay_UI_Prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {"""
          )

          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: extracted/AI_Camera_Overlay_UI_Prototype
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Overlay-APK
          path: extracted/AI_Camera_Overlay_UI_Prototype/app/build/outputs/apk/debug/app-debug.apk
